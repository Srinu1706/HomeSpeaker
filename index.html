<!doctype html>
<html lang="en-IN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#090a0d">
    <meta name="description"
        content="Professional cinema sound, concert PA, auditorium audio installation, system tuning and maintenance in Andhra Pradesh, India.">
    <title>Veyra Audio | Professional Sound Solutions</title>
    <style>
        :root {
            --bg: #090a0d;
            --panel: #13161b;
            --panel2: #1c2026;
            --text: #f4f5f6;
            --muted: #a4a8af;
            --accent: #e50914;
            --accent-hover: #ff2833;
            --line: #2b2e34;
            --blue: #65b9ff;
            --red: #ff6868;
            --amber: var(--accent);
            --amber2: #b80f19;
            --radius: 19px;
            --max: 1180px
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 94px
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 16px/1.55 system-ui, -apple-system, Segoe UI, sans-serif;
            overflow-x: hidden
        }

        body.modal-open {
            overflow: hidden
        }

        a {
            color: inherit;
            text-decoration: none
        }

        button,
        input,
        select,
        textarea {
            font: inherit
        }

        button {
            cursor: pointer
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed
        }

        button,
        input,
        select,
        textarea {
            accent-color: var(--amber)
        }

        :focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 3px
        }

        svg {
            max-width: 100%
        }

        .container {
            width: min(calc(100% - 36px), var(--max));
            margin: auto
        }

        .eyebrow {
            font-size: .76rem;
            text-transform: uppercase;
            letter-spacing: .18em;
            color: var(--amber);
            font-weight: 800
        }

        .muted {
            color: var(--muted)
        }

        h1,
        h2,
        h3,
        p {
            margin-top: 0
        }

        h1 {
            font-size: clamp(2.8rem, 7vw, 6.2rem);
            line-height: 1.01;
            letter-spacing: -.065em;
            text-wrap: balance
        }

        h2 {
            font-size: clamp(2rem, 4.4vw, 3.6rem);
            line-height: 1.1;
            letter-spacing: -.045em
        }

        h3 {
            font-size: 1.21rem;
            line-height: 1.3
        }

        section {
            padding: 75px 0
        }

        .section-head {
            max-width: 660px;
            margin-bottom: 30px
        }

        .section-head p {
            color: var(--muted)
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 9px;
            border: 1px solid transparent;
            padding: 13px 21px;
            border-radius: 7px;
            font-weight: 750;
            background: var(--accent);
            color: #fff;
            transition: transform .2s, background .2s, border-color .2s;
            box-shadow: 0 5px 18px #e5091420
        }

        .btn:hover {
            transform: translateY(-2px);
            background: var(--accent-hover)
        }

        .btn.secondary {
            background: transparent;
            color: var(--text);
            border-color: #565b63
        }

        .btn.secondary:hover {
            border-color: var(--amber);
            background: #1c1719;
            box-shadow: none
        }

        .btn.small {
            padding: 9px 14px;
            font-size: .9rem
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px
        }

        .card {
            background: linear-gradient(145deg, #191d23, #111419);
            border: 1px solid var(--line);
            padding: 24px;
            border-radius: var(--radius);
            transition: transform .25s, border-color .25s, box-shadow .25s
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #6f353a;
            box-shadow: 0 14px 30px #0006
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px
        }

        .two {
            grid-template-columns: repeat(2, minmax(0, 1fr))
        }

        .icon-square {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: #292024;
            color: var(--amber);
            font-size: 1.5rem;
            margin-bottom: 18px
        }

        .tag {
            display: inline-flex;
            font-size: .75rem;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--amber);
            border: 1px solid #653238;
            border-radius: 5px;
            padding: 5px 11px;
            background: #1d1719
        }

        .chip-row {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            margin: 25px 0
        }

        .chip,
        .slot {
            background: #1b1e23;
            color: #dedfe2;
            border: 1px solid #383c43;
            padding: 9px 15px;
            border-radius: 99px
        }

        .chip[aria-pressed=true],
        .slot[aria-pressed=true] {
            background: var(--amber);
            color: #fff;
            border-color: var(--amber);
            font-weight: 800
        }

        .notice {
            border-left: 3px solid var(--amber);
            padding: 11px 17px;
            background: #211719;
            color: #e2dadd;
            border-radius: 0 9px 9px 0
        }

        #site-header {
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid #282b31;
            background: #090a0df0;
            backdrop-filter: blur(15px);
            transition: transform .3s
        }

        #site-header.hidden {
            transform: translateY(-110%)
        }

        .header-inner {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.13rem;
            font-weight: 950;
            letter-spacing: .05em;
            white-space: nowrap
        }

        .brand svg {
            width: 32px;
            height: 32px
        }

        .brand span span {
            color: var(--amber)
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 20px
        }

        .nav a:not(.btn) {
            font-size: .91rem;
            color: #d7d9dd;
            position: relative;
            white-space: nowrap
        }

        .nav a:not(.btn):after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -8px;
            height: 2px;
            width: 0;
            background: var(--amber);
            transition: width .25s
        }

        .nav a[aria-current=page]:after,
        .nav a:not(.btn):hover:after {
            width: 100%
        }

        .menu-toggle {
            display: none;
            border: 1px solid var(--line);
            background: var(--panel);
            color: white;
            border-radius: 8px;
            padding: 7px 11px;
            font-size: 1.3rem
        }

        .page {
            animation: pageIn .38s both;
            min-height: 50vh
        }

        .page.exiting {
            animation: pageOut .16s both
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(13px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes pageOut {
            to {
                opacity: 0;
                transform: translateY(-8px)
            }
        }

        .hero {
            position: relative;
            overflow: hidden;
            min-height: 620px;
            display: grid;
            align-items: center;
            background: radial-gradient(ellipse at 78% 42%, #3a1118 0%, #19151a 34%, transparent 66%), linear-gradient(135deg, #12151b, #08090c)
        }

        .hero-inner {
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            align-items: center;
            gap: 28px;
            position: relative;
            z-index: 1
        }

        .hero p {
            max-width: 540px;
            color: #d3d5d9;
            font-size: 1.09rem
        }

        .hero h1 em {
            color: var(--amber);
            font-style: normal
        }

        .hero-art {
            position: relative;
            height: 440px;
            display: grid;
            place-items: center
        }

        .speaker {
            width: min(76%, 350px);
            aspect-ratio: 1;
            border-radius: 50%;
            border: 17px solid #2b3038;
            background: radial-gradient(circle, #e50914 0 8%, #51252a 9% 16%, #11151b 17% 31%, #47494d 32% 35%, #0c0e12 36% 56%, #272c33 57% 72%, #07080a 73%);
            box-shadow: 0 0 0 6px #060709, 0 0 50px #e5091440, inset 0 0 45px #000;
            animation: throb 2.3s infinite ease-in-out;
            z-index: 2
        }

        .ring {
            position: absolute;
            width: 60%;
            aspect-ratio: 1;
            border: 2px solid #e5091455;
            border-radius: 50%;
            animation: ring 3.3s infinite ease-out
        }

        .ring:nth-child(2) {
            animation-delay: 1.1s
        }

        .ring:nth-child(3) {
            animation-delay: 2.2s
        }

        .equalizer {
            position: absolute;
            bottom: 3%;
            display: flex;
            align-items: end;
            gap: 7px;
            height: 72px;
            opacity: .8
        }

        .equalizer i {
            width: 7px;
            background: linear-gradient(var(--accent-hover), #9b1018);
            border-radius: 3px;
            animation: eq 1s infinite ease-in-out alternate
        }

        .equalizer i:nth-child(2n) {
            animation-delay: -.6s
        }

        .equalizer i:nth-child(3n) {
            animation-delay: -.3s
        }

        @keyframes throb {
            50% {
                transform: scale(1.045)
            }
        }

        @keyframes ring {
            0% {
                transform: scale(.65);
                opacity: 0
            }

            20% {
                opacity: 1
            }

            100% {
                transform: scale(1.8);
                opacity: 0
            }
        }

        @keyframes eq {
            from {
                height: 9px
            }

            to {
                height: 65px
            }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
            border: 1px solid var(--line);
            border-radius: 18px;
            margin-top: -20px;
            position: relative;
            z-index: 2;
            background: #13161b;
            overflow: hidden
        }

        .stat {
            padding: 24px 16px;
            text-align: center;
            border-right: 1px solid var(--line)
        }

        .stat:last-child {
            border: 0
        }

        .stat strong {
            font-size: 2.3rem;
            display: block;
            color: var(--amber);
            line-height: 1.2
        }

        .stat span {
            font-size: .84rem;
            color: var(--muted)
        }

        .media {
            position: relative;
            overflow: hidden;
            aspect-ratio: 16/10;
            border-radius: 13px;
            background: radial-gradient(ellipse at 55% 90%, #331a1f, #11151b 67%);
            display: grid;
            place-items: center;
            margin-bottom: 16px
        }

        .media svg {
            width: 95%;
            height: 95%;
            filter: drop-shadow(0 12px 13px #0009)
        }

        .meta {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            color: var(--muted);
            font-size: .81rem;
            margin-top: 10px
        }

        .testimonial q {
            font-size: 1.05rem;
            display: block;
            margin: 15px 0
        }

        .banner {
            background: radial-gradient(circle at 90% 5%, #45141a, transparent 52%), linear-gradient(125deg, #21181b, #15181e);
            border: 1px solid #633038;
            border-radius: 16px;
            padding: 45px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px
        }

        .page-hero {
            padding: 75px 0 42px;
            background: radial-gradient(ellipse at 75% 0%, #291216, transparent 65%)
        }

        .page-hero p {
            max-width: 680px;
            color: var(--muted);
            font-size: 1.08rem
        }

        .process {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 13px;
            counter-reset: step
        }

        .process .card {
            padding: 17px
        }

        .step-num {
            color: var(--amber);
            font-size: 1.6rem;
            font-weight: 900
        }

        .format-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.3fr) minmax(280px, .9fr);
            gap: 25px;
            align-items: start
        }

        .diagram-wrap {
            min-width: 0;
            padding: 16px;
            background: #12161c;
            border: 1px solid #343840;
            border-radius: 17px
        }

        .diagram-wrap svg {
            display: block;
            width: 100%;
            height: auto
        }

        .speaker-node {
            opacity: 0;
            animation: speaker-in .38s cubic-bezier(.2, .8, .25, 1) both;
            animation-delay: var(--delay, 0ms);
            filter: drop-shadow(0 0 7px var(--speaker-glow))
        }

        .speaker-node.is-new {
            animation: speaker-highlight 1s ease-out both;
            animation-delay: var(--delay, 0ms)
        }

        .speaker-node.is-active .speaker-cabinet {
            filter: drop-shadow(0 0 12px var(--speaker-color))
        }

        @keyframes speaker-in {
            from {
                opacity: 0;
                scale: .48
            }

            to {
                opacity: 1;
                scale: 1
            }
        }

        @keyframes speaker-highlight {
            0% {
                opacity: 0;
                scale: .5
            }

            32% {
                opacity: 1;
                scale: 1.14;
                filter: drop-shadow(0 0 18px var(--speaker-color))
            }

            100% {
                opacity: 1;
                scale: 1;
                filter: drop-shadow(0 0 7px var(--speaker-glow))
            }
        }

        .format-content.is-changing .speaker-node {
            opacity: 0;
            scale: .7;
            transition: opacity .13s ease-in, scale .13s ease-in
        }

        /* Speaker visualizer: only affects the Services sound-format section. */
        .room-svg {
            overflow: visible;
            width: 100%;
            height: auto;
            display: block
        }

        .speaker-node {
            opacity: 1;
            transform-box: fill-box;
            transform-origin: center;
            animation: speaker-pop .43s cubic-bezier(.18, .9, .3, 1.25) both;
            animation-delay: var(--delay)
        }

        .speaker-node.is-new .speaker-cabinet {
            filter: drop-shadow(0 0 9px var(--speaker-color))
        }

        .speaker-node.is-active .speaker-cabinet {
            filter: drop-shadow(0 0 16px var(--speaker-color)) brightness(1.7)
        }

        .sound-arc {
            animation: wave-dash 6s linear infinite
        }

        @keyframes speaker-pop {
            from {
                opacity: 0;
                scale: .4
            }

            to {
                opacity: 1;
                scale: 1
            }
        }

        @keyframes wave-dash {
            to {
                stroke-dashoffset: -120
            }
        }

        @media(prefers-reduced-motion:reduce) {

            .speaker-node,
            .sound-arc {
                animation: none !important;
                opacity: 1 !important;
                scale: 1 !important
            }
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 9px 16px;
            font-size: .83rem;
            color: #d3d5d9;
            margin-top: 12px
        }

        .legend span {
            display: inline-flex;
            align-items: center
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px
        }

        .format-demo-tools {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 9px;
            margin-top: 16px
        }

        .format-demo-tools .btn {
            min-height: 40px
        }

        .format-status {
            min-height: 1.5em;
            margin: 10px 0 0;
            color: var(--muted);
            font-size: .82rem
        }

        .format-summary h3 {
            font-size: 1.55rem;
            margin: 8px 0
        }

        .format-counts {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin: 16px 0
        }

        .format-count {
            padding: 11px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #111722
        }

        .format-count strong {
            display: block;
            color: var(--amber);
            font-size: 1.2rem
        }

        .format-count span {
            color: var(--muted);
            font-size: .77rem
        }

        .format-note {
            padding: 11px 13px;
            border-left: 3px solid var(--amber);
            background: #201719;
            color: #d8dade;
            font-size: .82rem
        }

        .channel-list {
            padding: 0;
            list-style: none;
            margin: 13px 0
        }

        .channel-list li {
            padding: 8px 0;
            border-bottom: 1px solid #2b2e34;
            color: #c9cdd2
        }

        .channel-list b {
            color: var(--amber)
        }

        .project-card {
            display: block;
            width: 100%;
            text-align: left;
            color: inherit;
            cursor: pointer
        }

        .project-card .media {
            margin: -8px -8px 16px
        }

        .project-card h3 {
            margin-bottom: 4px
        }

        .project-card:hover .media svg {
            transform: scale(1.04)
        }

        .media svg {
            transition: transform .3s
        }

        .partner-logo {
            font-size: 1.35rem;
            font-weight: 900;
            min-height: 110px;
            display: grid;
            place-items: center;
            filter: grayscale(1);
            color: #b5bdcb;
            transition: filter .2s, color .2s
        }

        .partner-logo:hover {
            filter: none;
            color: var(--amber)
        }

        .partner-logo small {
            font-size: .65rem;
            letter-spacing: .18em;
            font-weight: 500;
            display: block;
            text-align: center
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 17px
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px
        }

        .field.full {
            grid-column: 1/-1
        }

        .field label {
            font-size: .87rem;
            font-weight: 750
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            background: #0e1116;
            color: #f4f5f6;
            border: 1px solid #383c43;
            border-radius: 10px;
            padding: 12px;
            min-height: 47px
        }

        .field textarea {
            min-height: 95px;
            resize: vertical
        }

        .field [aria-invalid=true] {
            border-color: #ff7474
        }

        .error {
            color: #ff9090;
            font-size: .76rem;
            min-height: 16px
        }

        .form-actions {
            margin-top: 17px
        }

        .slot-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }

        .accordion {
            border: 1px solid var(--line);
            border-radius: 12px;
            margin: 10px 0;
            overflow: hidden;
            background: #13161b
        }

        .accordion button {
            width: 100%;
            background: transparent;
            color: #f4f5f6;
            border: 0;
            text-align: left;
            padding: 17px 19px;
            font-weight: 750;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .accordion button span:last-child {
            color: var(--amber);
            transition: transform .25s
        }

        .accordion button[aria-expanded=true] span:last-child {
            transform: rotate(45deg)
        }

        .accordion-body {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows .28s
        }

        .accordion-body.open {
            grid-template-rows: 1fr
        }

        .accordion-body>div {
            overflow: hidden
        }

        .accordion-body p {
            padding: 0 19px 17px;
            margin: 0;
            color: var(--muted)
        }

        .download {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px
        }

        .booking-layout {
            display: grid;
            grid-template-columns: 1.65fr .85fr;
            gap: 25px;
            align-items: start
        }

        .sidebar-stack {
            display: grid;
            gap: 16px
        }

        .success {
            text-align: center;
            padding: 35px 10px
        }

        .success .check {
            font-size: 4rem;
            color: #7dd7a4
        }

        .whatsapp {
            position: fixed;
            right: 22px;
            bottom: 22px;
            z-index: 48;
            background: #22c565;
            color: #082614;
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            box-shadow: 0 0 0 0 #22c56555;
            animation: waPulse 2.4s infinite
        }

        .whatsapp svg {
            width: 31px;
            height: 31px
        }

        @keyframes waPulse {
            60% {
                box-shadow: 0 0 0 16px transparent
            }

            100% {
                box-shadow: 0 0 0 0 transparent
            }
        }

        footer {
            padding: 54px 0 20px;
            background: #08090c;
            border-top: 1px solid var(--line)
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1.4fr;
            gap: 35px
        }

        .footer-links {
            display: grid;
            gap: 8px;
            color: var(--muted)
        }

        .footer-links a:hover {
            color: var(--amber)
        }

        .bottom {
            border-top: 1px solid var(--line);
            padding-top: 18px;
            margin-top: 40px;
            color: var(--muted);
            font-size: .8rem
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: #000b;
            z-index: 90;
            display: grid;
            place-items: center;
            padding: 20px;
            animation: fade .2s
        }

        .modal {
            width: min(100%, 590px);
            background: #15191f;
            border: 1px solid #493238;
            border-radius: 12px;
            padding: 28px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn .25s
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 12px
        }

        .close {
            background: #22262d;
            color: #f4f5f6;
            border: 1px solid #41464f;
            border-radius: 8px;

            padding: 2px 10px
        }

        @keyframes fade {
            from {
                opacity: 0
            }
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(22px) scale(.97)
            }
        }

        .reveal {
            opacity: 0;
            transform: translateY(18px);
            transition: opacity .6s, transform .6s;
            transition-delay: var(--stagger, 0ms)
        }

        .reveal.visible {
            opacity: 1;
            transform: none
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0
        }

        @media(max-width:950px) {
            .nav {
                gap: 10px
            }

            .nav a:not(.btn) {
                font-size: .8rem
            }

            .header-inner>.btn {
                display: none
            }

            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr))
            }

            .process {
                grid-template-columns: repeat(3, 1fr)
            }
        }

        @media(max-width:720px) {
            section {
                padding: 51px 0
            }

            .menu-toggle {
                display: block
            }

            .nav {
                display: none;
                position: absolute;
                left: 0;
                right: 0;
                top: 76px;
                background: #0e1116f2;
                border-bottom: 1px solid var(--line);
                padding: 20px;
                flex-direction: column;
                align-items: stretch;
                gap: 19px
            }

            .nav.open {
                display: flex
            }

            .nav a {
                font-size: 1rem !important
            }

            .hero {
                min-height: auto;
                padding: 65px 0 50px
            }

            .hero-inner {
                grid-template-columns: 1fr
            }

            .hero-art {
                height: 300px
            }

            .speaker {
                width: 230px;
                border-width: 13px
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
                margin-top: 0
            }

            .stat:nth-child(2) {
                border-right: 0
            }

            .stat:nth-child(-n+2) {
                border-bottom: 1px solid var(--line)
            }

            .grid,
            .two,
            .booking-layout,
            .format-layout {
                grid-template-columns: 1fr
            }

            .process {
                grid-template-columns: repeat(2, 1fr)
            }

            .banner {
                padding: 30px 23px;
                display: block
            }

            .banner .btn {
                margin-top: 12px
            }

            .footer-grid {
                grid-template-columns: 1fr 1fr
            }

            .footer-grid>div:first-child {
                grid-column: 1/-1
            }

            .page-hero {
                padding: 50px 0 20px
            }

            .diagram-wrap {
                padding: 9px
            }

            .format-demo-tools .btn {
                flex: 1 1 auto
            }
        }

        @media(prefers-reduced-motion: reduce) {

            .speaker-node,
            .speaker-node.is-new {
                animation: none;
                opacity: 1;
                filter: none
            }

            .speaker-node.is-active .speaker-cabinet {
                filter: drop-shadow(0 0 8px var(--speaker-color))
            }

            .format-content.is-changing .speaker-node {
                opacity: 1;
                scale: 1;
                transition: none
            }
        }

        @media(max-width:480px) {

            .form-grid,
            .process {
                grid-template-columns: 1fr
            }

            .container {
                width: min(calc(100% - 28px), var(--max))
            }

            .hero-art {
                height: 240px
            }

            .speaker {
                width: 190px
            }

            .stat strong {
                font-size: 1.85rem
            }

            .footer-grid {
                grid-template-columns: 1fr
            }

            .footer-grid>div:first-child {
                grid-column: auto
            }

                right: 14px;
                bottom: 14px
            }
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation: none !important;
                transition: none !important
            }

            .reveal {
                opacity: 1;
                transform: none
            }
        }

        function reference(prefix) {const arr = new Uint32Array(1); if (window.crypto?.getRandomValues) crypto.getRandomValues(arr); else arr[0] = Math.floor(Math.random() * 1000000000); return prefix + '-' + new Date().toISOString().slice(0, 10).replaceAll('-', '') + '-' + String(arr[0] % 1000000).padStart(6, '0')}
        function bindBooking() {const f = $('#booking-form'); $$('[data-time]').forEach(b => b.onclick = () => {$$('[data-time]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); $('#selected-time').value = b.dataset.time; $('[data-error="time"]').textContent = ''}); f.addEventListener('submit', e => {e.preventDefault(); const {data, errors} = validate(f, ['name', 'phone', 'email', 'venue', 'capacity', 'city', 'date', 'service', 'time']); if (Object.keys(errors).length) {const key = Object.keys(errors)[0]; (f.elements[key]?.type === 'hidden' ? f.querySelector('[data-time]') : f.elements[key])?.focus(); return } const ref = reference('VIS');/* TODO: Send validated `data` to your secure backend/API. Use server-side validation, rate limiting, spam protection, an idempotency key, database persistence and an actual confirmation response before calling the appointment booked. */$('#booking-card').innerHTML = `<div class="success" role="status"><div class="check" aria-hidden="true">✓</div><h2>Request prepared!</h2><p>Your details passed local validation. This is a <b>demo success screen</b>; no appointment was sent or confirmed.</p><p class="eyebrow">Demo reference ID</p><h3 style="font-size:1.7rem;word-break:break-word">${ref}</h3><p class="muted">Preferred visit: ${esc(data.date)} at ${esc(data.time)} • ${esc(data.city)}</p><div class="btn-row" style="justify-content:center"><a class="btn" target="_blank" rel="noopener noreferrer" href="${whatsapp('Hello, I would like to request a site visit. Demo reference ' + ref + '. Venue: ' + data.venue + ', city: ' + data.city + ', date: ' + data.date + ' ' + data.time + '.')}">Send request on WhatsApp →</a><a class="btn secondary" href="#/support">Explore Support</a></div></div>`; $('#booking-card').scrollIntoView({block: 'start', behavior: reduced ? 'instant' : 'smooth'})})}
        function renderFooter() {$('#footer').innerHTML = `<div class="container"><div class="footer-grid"><div><div class="brand" style="margin-bottom:15px">◉ <span>VEYRA<span> AUDIO</span></span></div><p class="muted" style="max-width:350px">Professional audio systems for cinema, live events and auditoriums. Designed for your space.</p><span class="tag">Andhra Pradesh • India</span></div><div><h3>Explore</h3><div class="footer-links">${Object.entries(PATH_TITLES).map(([p, n]) => `<a href="#${p}">${n}</a>`).join('')}</div></div><div><h3>Contact</h3><div class="footer-links"><a href="tel:${SITE.phone.replace(/\s/g, '')}">${SITE.phone}</a><a href="mailto:${SITE.email}">${SITE.email}</a><span>${SITE.address}</span><a href="${whatsapp()}" target="_blank" rel="noopener noreferrer">WhatsApp us →</a></div></div></div><div class="bottom">© <span id="copyright-year">${new Date().getFullYear()}</span> ${SITE.brand}. Demo website — sample statistics, works, testimonials and partners are placeholders.</div></div>`; $('#whatsapp').href = whatsapp()}
        $('#menu-toggle').onclick = () => {const open = $('#nav').classList.toggle('open'); $('#menu-toggle').setAttribute('aria-expanded', String(open)); $('#menu-toggle').textContent = open ? '×' : '☰'};
        let scrollScheduled = false; window.addEventListener('scroll', () => {if (scrollScheduled) return; scrollScheduled = true; requestAnimationFrame(() => {const y = scrollY; if (y > 160 && y > lastScroll + 7 && !$('#nav').classList.contains('open') && !$('#modal-backdrop')) $('#site-header').classList.add('hidden'); else if (y < lastScroll - 7 || y < 70) $('#site-header').classList.remove('hidden'); lastScroll = y; scrollScheduled = false})}, {passive: true});
        window.addEventListener('hashchange', render); renderFooter(); render();
    </script>
